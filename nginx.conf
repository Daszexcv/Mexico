# ============================================================
# nginx.conf — Ресторан «Мехико»
# Для Nginx-хостинга (VPS, Timeweb Cloud, VDSina, и др.)
#
# Скопируйте содержимое в конфигурацию вашего сервера:
#   /etc/nginx/sites-available/mexico.conf
# Затем:
#   sudo ln -s /etc/nginx/sites-available/mexico.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name ваш-домен.ru www.ваш-домен.ru;

    # Перенаправление HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ваш-домен.ru www.ваш-домен.ru;

    # --- SSL-сертификат (Let's Encrypt) ---
    # Получить: sudo certbot --nginx -d ваш-домен.ru -d www.ваш-домен.ru
    ssl_certificate     /etc/letsencrypt/live/ваш-домен.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ваш-домен.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Корневая директория сайта ---
    root /var/www/mexico;
    index index.html;

    # --- Кодировка ---
    charset utf-8;

    # --- Заголовки безопасности ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com https://*.imgbb.com https://i.ibb.co data:; connect-src 'self' https://api.telegram.org https://formsubmit.co; frame-src https://formsubmit.co;" always;

    # --- Основная локация ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Сжатие GZIP ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # --- Кеширование статики ---
    location ~* \.(css|js|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Запрет доступа к служебным файлам ---
    location ~ /\. {
        deny all;
    }

    location ~* \.(htaccess|htpasswd|ini|log|sh|sql|conf|env)$ {
        deny all;
    }

    # --- Защита админки (опционально: ограничение по IP) ---
    # Раскомментируйте и укажите свой IP для дополнительной защиты:
    # location = /admin.html {
    #     allow 123.45.67.89;  # Ваш IP-адрес
    #     deny all;
    # }

    # --- Логи ---
    access_log /var/log/nginx/mexico_access.log;
    error_log  /var/log/nginx/mexico_error.log;
}
